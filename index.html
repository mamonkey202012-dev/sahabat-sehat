    <script>
      // Suppress benign WebSocket HMR connection errors in sandboxed dev environment
      window.addEventListener('unhandledrejection', function(event) {
        var msg = (event.reason && (event.reason.message || event.reason)) || '';
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('[vite]'))) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('[vite]'))) {
          event.preventDefault();
        }
      });
    </script>
